{% extends 'layouts/base.html' %}

{% block content %}
    <h1 class="mb-4">Dashboard</h1>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card bg-primary text-white mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Commodities</h5>
                    <p class="card-text display-4">{{ stats.commodities }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Markets</h5>
                    <p class="card-text display-4">{{ stats.markets }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-info text-white mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Price Records</h5>
                    <p class="card-text display-4">{{ stats.prices }}</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Price Overview</h5>
            <canvas id="priceChart" height="100"></canvas>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script>
        const ctx = document.getElementById('priceChart').getContext('2d');
        const priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr'],
                datasets: [{
                    label: 'Prices',
                    data: [10, 20, 15, 25],
                    backgroundColor: 'rgba(0, 123, 255, 0.5)',
                    borderColor: 'rgba(0, 123, 255, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
{% endblock %}
